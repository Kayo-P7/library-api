<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            width: 350px;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #222;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Login</h1>

    <form th:action="@{/login}" method="post">

        <div class="input-group">
            <label for="username">Usuário</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Digite seu usuário"
                    required>
        </div>

        <div class="input-group">
            <label for="password">Senha</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite sua senha"
                    required>
        </div>

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
