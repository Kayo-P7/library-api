spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: config-db
  application:
    name: libraryapi
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true

  #jpa:
    #show-sql: true
    #hibernate:
     #ddl-autorId: update

